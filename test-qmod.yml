name: Christmas Quest 1.40.8 test QMOD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected testing branch
        uses: actions/checkout@v4
      - name: Validate target and required source assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.packageVersion' mod.template.json)" = "1.40.8_7379"
          test "$(jq -r '.info.id' qpm.json)" = "christmas"
          for item in assets/logo.png assets/snowflakes.png cover.png \
            FileCopies/we_wish_you_a_merry_christmas.ogg \
            FileCopies/dance_of_the_sugar_plum_fairy.ogg \
            FileCopies/M668_Christmas_Lights_5m22_click_removed.ogg; do
            if [ ! -f "$item" ]; then
              echo "::error::Missing required asset: $item"
              exit 1
            fi
          done
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3
      - name: Setup QPM and NDK
        uses: fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: true
          resolve_ndk: true
          cache: true
          qpm_version: version@1.*
      - name: Build standalone testing QMOD
        shell: bash
        run: qpm s qmod
      - name: Upload private testing artifact only
        uses: actions/upload-artifact@v4
        with:
          name: christmas-quest-1.40.8-test
          if-no-files-found: error
          path: 'Christmas Eve.qmod'
