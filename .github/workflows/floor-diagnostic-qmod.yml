name: Christmas Eve floor diagnostic QMOD (no publication)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-qmod:
    if: github.ref == 'refs/heads/diagnostic/floor-color-restoration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout floor diagnostic branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check provenance, manifest, paths and audio inventory
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 640673bdead25439b119359a1b6e7aa67079cc50 HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(jq -r '.info.id' qpm.json)" = "christmas"
          test "$(jq -r '.info.version' qpm.json)" = "1.0.0"
          test "$(jq -r '.version' mod.template.json)" = "1.0.0"
          test "$(jq -r '.packageVersion' mod.template.json)" = "1.40.8_7379"
          test "$(jq -r '.description' mod.template.json)" = "Celebrate Christmas Eve on a peaceful, snowy alpine winter night."
          test "$(jq -r '.fileCopies | length' mod.template.json)" = "4"
          test -f CMakeLists.txt
          test -f cmake/targets/quest.cmake
          test -f scripts/build.ps1
          test -f scripts/createqmod.ps1
          test -d src
          test -d include
          for item in Cover.png ChristmasEve-README.png \
            assets/logo.png assets/snowflakes.png \
            FileCopies/we_wish_you_a_merry_christmas.ogg \
            FileCopies/dance_of_the_sugar_plum_fairy.ogg \
            FileCopies/M668_Christmas_Lights_5m22_click_removed.ogg \
            FileCopies/christmas-eve-aurora-jingle.ogg; do
            test -s "$item" || { echo "::error::Missing/empty source asset: $item"; exit 1; }
          done
          python3 - <<'PY'
          import json, pathlib, struct
          mod = json.load(open("mod.template.json"))
          root = pathlib.Path("FileCopies")
          expected = {x["name"] for x in mod["fileCopies"]}
          actual = {p.name for p in root.glob("*.ogg")}
          assert actual == expected, (actual, expected)
          for name in expected:
              with (root / name).open("rb") as f:
                  assert f.read(4) == b"OggS", name
          assert not pathlib.Path("cover.png").exists(), "Removed original cover.png unexpectedly restored"
          assert pathlib.Path("Cover.png").read_bytes() == pathlib.Path("ChristmasEve-README.png").read_bytes(), "QMOD cover differs from approved README artwork"
          assert mod["coverImage"] == "Cover.png"
          for path in [pathlib.Path("Cover.png"), pathlib.Path("ChristmasEve-README.png"), *pathlib.Path("assets").glob("*.png")]:
              with path.open("rb") as f:
                  header = f.read(24)
              assert header[:8] == b"\x89PNG\r\n\x1a\n", path
              w, h = struct.unpack(">II", header[16:24])
              assert w > 0 and h > 0
              print(f"PNG {path}: {w}x{h}")
          print("Four Ogg source files and PNG headers verified")
          PY

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Setup QPM and Android NDK
        uses: fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: true
          resolve_ndk: true
          cache: true
          qpm_version: version@1.*

      - name: Compile and package in runner only
        shell: bash
        run: |
          set -euo pipefail
          qpm s qmod

      - name: Inspect actual QMOD and ARM64 shared library without uploading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, struct, zipfile
          packages = sorted(pathlib.Path(".").glob("*.qmod"))
          assert len(packages) == 1, f"Expected one QMOD; found {packages}"
          package = packages[0]
          expected = {v["name"] for v in json.load(open("mod.template.json"))["fileCopies"]}
          with zipfile.ZipFile(package) as z:
              bad = z.testzip()
              assert bad is None, f"Corrupt zip member: {bad}"
              names = z.namelist()
              print("QMOD package:", package.name, "bytes:", package.stat().st_size)
              print("QMOD entries:", names)
              manifest_names = [n for n in names if n.endswith("mod.json")]
              assert len(manifest_names) == 1, manifest_names
              manifest = json.loads(z.read(manifest_names[0]))
              assert manifest["id"] == "christmas"
              assert manifest["version"] == "1.0.0"
              assert manifest["packageVersion"] == "1.40.8_7379"
              assert manifest["description"] == "Celebrate Christmas Eve on a peaceful, snowy alpine winter night."
              assert {v["name"] for v in manifest["fileCopies"]} == expected
              for audio in expected:
                  matches = [n for n in names if n.rsplit("/", 1)[-1] == audio]
                  assert len(matches) == 1, (audio, matches)
                  assert z.read(matches[0])[:4] == b"OggS", audio
                  print("Verified audio:", audio)
              cover = manifest["coverImage"]
              assert cover == "Cover.png", cover
              assert any(n.rsplit("/",1)[-1] == cover for n in names), cover
              assert not any(n.rsplit("/",1)[-1] == "cover.png" for n in names), "Original cover must not be packaged"
              assert z.read(next(n for n in names if n.rsplit("/",1)[-1] == cover)) == pathlib.Path("Cover.png").read_bytes(), "Packaged cover does not match approved artwork"
              libs = [n for n in names if n.rsplit("/",1)[-1] == "libchristmas.so"]
              assert len(libs) == 1, libs
              elf = z.read(libs[0])[:64]
              assert elf[:4] == b"\x7fELF"
              assert elf[4] == 2, "Expected ELF64"
              assert elf[5] == 1, "Expected little-endian"
              assert struct.unpack_from("<H", elf, 18)[0] == 183, "Expected AArch64"
              print("Verified ELF64 AArch64:", libs[0])
              print("PASS: v1.0.0 QMOD packaged with all four audio tracks")
          PY
          echo "Verification only; no release or deployment."

      - name: Retain verified QMOD for release-asset review
        uses: actions/upload-artifact@v4
        with:
          name: christmas-eve-floor-diagnostic-qmod
          path: "*.qmod"
          if-no-files-found: error
          retention-days: 30
